[project]
name = "dotfiles"
version = "0.1.0"
dependencies = []
requires-python = ">=3.8"

[tool.uv]
managed = true
exclude-newer = "10 days"

[tool.uv.workspace]
members = []

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py38"

# Development checks:
# uv run ruff format manage
# uv run ruff check manage
# uv run ty check manage

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "ty>=0.0.34; python_version >= '3.12'",
]
